<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OED Hourly Refresh Benchmark</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Courier New', monospace; background: #0d1117; color: #e6edf3; min-height: 100vh; padding: 40px; }
        header { margin-bottom: 40px; }
        header h1 { font-size: 1.4rem; font-weight: normal; color: #58a6ff; letter-spacing: 0.05em; text-transform: uppercase; }
        header p { color: #8b949e; font-size: 0.85rem; margin-top: 6px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 24px; }
        .card.full { grid-column: 1 / -1; }
        .card h2 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: #8b949e; margin-bottom: 20px; }
        .chart-container { position: relative; height: 320px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
        th { text-align: left; padding: 8px 12px; color: #8b949e; font-weight: normal; border-bottom: 1px solid #30363d; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
        td { padding: 10px 12px; border-bottom: 1px solid #21262d; color: #e6edf3; }
        tr:last-child td { border-bottom: none; }
        td.good { color: #3fb950; }
        td.warn { color: #d29922; }
        td.highlight { color: #f85149; font-weight: bold; }
        .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .stat { background: #0d1117; border: 1px solid #30363d; border-radius: 4px; padding: 16px; }
        .stat .label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: #8b949e; margin-bottom: 8px; }
        .stat .value { font-size: 1.6rem; color: #58a6ff; }
        .stat .unit { font-size: 0.75rem; color: #8b949e; margin-left: 4px; }
        .paste-area { width: 100%; background: #0d1117; border: 1px solid #30363d; border-radius: 4px; color: #e6edf3; font-family: 'Courier New', monospace; font-size: 0.8rem; padding: 12px; resize: vertical; min-height: 100px; }
        .paste-area:focus { outline: 1px solid #58a6ff; }
        button { margin-top: 12px; background: #238636; border: 1px solid #2ea043; color: #fff; font-family: 'Courier New', monospace; font-size: 0.85rem; padding: 8px 20px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #2ea043; }
        .error { color: #f85149; font-size: 0.8rem; margin-top: 8px; }
        .legend { display: flex; gap: 20px; margin-bottom: 16px; font-size: 0.78rem; color: #8b949e; }
        .legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
        .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; font-size: 0.78rem; color: #8b949e; margin-bottom: 12px; }
    </style>
</head>
<body>

<header>
    <h1>OED // Hourly Refresh Benchmark</h1>
    <p>Compares old hourly materialized-view refresh/query flow vs new Timescale hourly cagg refresh/query flow under simulated one-hour data ingestion.</p>
</header>

<div class="card full" style="margin-bottom: 24px;">
    <h2>Paste benchmark_hourly_refresh_results.json</h2>
    <textarea class="paste-area" id="jsonInput" placeholder='{"meta":{"meterId":1},"results":[{"name":"hourly segments","segments":8760,"oldHourly":{"refreshMs":123,"queryAvgMs":456,"totalMs":579},"newHourly":{"refreshMs":10,"queryAvgMs":22,"totalMs":32}}]}'></textarea>
    <button onclick="loadData()">Load Results</button>
    <div class="error" id="error"></div>
</div>

<div class="card full" id="metaCard" style="display:none; margin-bottom:24px;">
    <h2>Benchmark Context</h2>
    <div class="meta" id="meta"></div>
</div>

<div class="stat-grid" id="stats"></div>
<div class="grid" id="charts"></div>

<script>
let charts = {};

function loadData() {
    const input = document.getElementById('jsonInput').value.trim();
    const errorEl = document.getElementById('error');
    errorEl.textContent = '';
    let payload;
    try {
        payload = JSON.parse(input);
        if (Array.isArray(payload)) {
            payload = { results: payload };
        }
        if (!payload.results || !Array.isArray(payload.results)) {
            throw new Error('Expected an object with a results array');
        }
        if (!payload.results[0] || !payload.results[0].oldHourly || !payload.results[0].newHourly) {
            throw new Error('Missing oldHourly/newHourly fields');
        }
    } catch (e) {
        errorEl.textContent = 'Invalid JSON: ' + e.message;
        return;
    }
    renderAll(payload);
}

function renderAll(payload) {
    const data = payload.results;
    const meta = payload.meta || {};
    const gc = '#21262d';
    const tc = '#8b949e';
    const labels = data.map(d => d.segments.toLocaleString() + ' segs');
    const worstByTotal = data.reduce((acc, row) => row.oldHourly.totalMs > acc.oldHourly.totalMs ? row : acc, data[0]);
    const bestSpeedup = Math.max(...data.map(d => parseFloat((d.oldHourly.totalMs / d.newHourly.totalMs).toFixed(2))));

    const metaCard = document.getElementById('metaCard');
    if (Object.keys(meta).length > 0) {
        metaCard.style.display = 'block';
        document.getElementById('meta').innerHTML = `
            <div>meter_id: ${meta.meterId ?? 'n/a'}</div>
            <div>source_id: ${meta.sourceId ?? 'n/a'}</div>
            <div>destination_id: ${meta.destinationId ?? 'n/a'}</div>
            <div>query runs: ${meta.queryRuns ?? 'n/a'}</div>
            <div>inserted rows: ${meta.insertedRows ?? 'n/a'}</div>
            <div>query range: ${meta.queryStart ?? 'n/a'} -> ${meta.queryEndExclusive ?? 'n/a'}</div>
        `;
    } else {
        metaCard.style.display = 'none';
    }

    document.getElementById('stats').innerHTML = `
        <div class="stat"><div class="label">Worst Old Total</div><div class="value">${worstByTotal.oldHourly.totalMs.toLocaleString()}<span class="unit">ms</span></div></div>
        <div class="stat"><div class="label">Worst New Total</div><div class="value">${worstByTotal.newHourly.totalMs.toLocaleString()}<span class="unit">ms</span></div></div>
        <div class="stat"><div class="label">Best Total Speedup</div><div class="value">${bestSpeedup}<span class="unit">x</span></div></div>
        <div class="stat"><div class="label">Worst Scenario</div><div class="value" style="font-size:1.1rem;">${worstByTotal.name}</div></div>
    `;

    const chartsEl = document.getElementById('charts');
    chartsEl.innerHTML = `
        <div class="card full">
            <h2>Refresh Time Change</h2>
            <div class="legend">
                <span><span class="legend-dot" style="background:#8b949e"></span>old hourly refresh</span>
                <span><span class="legend-dot" style="background:#3fb950"></span>new cagg refresh</span>
            </div>
            <div class="chart-container"><canvas id="totalChart"></canvas></div>
        </div>
        <div class="card">
            <h2>Refresh Time</h2>
            <div class="chart-container"><canvas id="refreshChart"></canvas></div>
        </div>
        <div class="card">
            <h2>Post-Refresh Query Time</h2>
            <div class="chart-container"><canvas id="queryChart"></canvas></div>
        </div>
        <div class="card full">
            <h2>Total Speedup</h2>
            <div class="chart-container"><canvas id="speedupChart"></canvas></div>
        </div>
        <div class="card full">
            <h2>Results Table</h2>
            <table id="resultsTable"></table>
        </div>
    `;

    Object.values(charts).forEach(chart => chart.destroy());
    charts = {};

    charts.total = new Chart(document.getElementById('totalChart'), {
        type: 'line',
        data: {
            labels,
            datasets: [
                { label: 'old hourly refresh', data: data.map(d => d.oldHourly.refreshMs), borderColor: '#8b949e', backgroundColor: 'rgba(139,148,158,0.07)', fill: true, tension: 0.3, pointRadius: 5, borderDash: [4,3] },
                { label: 'new cagg refresh', data: data.map(d => d.newHourly.refreshMs), borderColor: '#3fb950', backgroundColor: 'rgba(63,185,80,0.07)', fill: true, tension: 0.3, pointRadius: 5 }
            ]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { labels: { color: tc } } },
            scales: {
                x: { ticks: { color: tc }, grid: { color: gc } },
                y: { ticks: { color: tc, callback: v => v + 'ms' }, grid: { color: gc } }
            }
        }
    });

    charts.refresh = new Chart(document.getElementById('refreshChart'), {
        type: 'bar',
        data: {
            labels,
            datasets: [
                { label: 'old hourly refresh', data: data.map(d => d.oldHourly.refreshMs), backgroundColor: 'rgba(139,148,158,0.7)' },
                { label: 'new cagg refresh', data: data.map(d => d.newHourly.refreshMs), backgroundColor: 'rgba(63,185,80,0.7)' }
            ]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { labels: { color: tc } } },
            scales: {
                x: { ticks: { color: tc }, grid: { color: gc } },
                y: { ticks: { color: tc, callback: v => v + 'ms' }, grid: { color: gc } }
            }
        }
    });

    charts.query = new Chart(document.getElementById('queryChart'), {
        type: 'line',
        data: {
            labels,
            datasets: [
                { label: 'old hourly query', data: data.map(d => d.oldHourly.queryAvgMs), borderColor: '#8b949e', tension: 0.3, pointRadius: 5, borderDash: [4,3] },
                { label: 'new cagg query', data: data.map(d => d.newHourly.queryAvgMs), borderColor: '#58a6ff', tension: 0.3, pointRadius: 5 }
            ]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { labels: { color: tc } } },
            scales: {
                x: { ticks: { color: tc }, grid: { color: gc } },
                y: { ticks: { color: tc, callback: v => v + 'ms' }, grid: { color: gc } }
            }
        }
    });

    charts.speedup = new Chart(document.getElementById('speedupChart'), {
        type: 'bar',
        data: {
            labels,
            datasets: [
                {
                    label: 'old total / new total',
                    data: data.map(d => parseFloat((d.oldHourly.totalMs / d.newHourly.totalMs).toFixed(2))),
                    backgroundColor: 'rgba(88,166,255,0.7)'
                }
            ]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { labels: { color: tc } } },
            scales: {
                x: { ticks: { color: tc }, grid: { color: gc } },
                y: { ticks: { color: tc, callback: v => v + 'x' }, grid: { color: gc }, title: { display: true, text: 'Times faster', color: tc } }
            }
        }
    });

    document.getElementById('resultsTable').innerHTML = `
        <tr>
            <th>Scenario</th>
            <th>Segs</th>
            <th>Old Refresh</th>
            <th>Old Query</th>
            <th>Old Total</th>
            <th>New Refresh</th>
            <th>New Query</th>
            <th>New Total</th>
            <th>Total Speedup</th>
        </tr>
        ${data.map(d => `
            <tr>
                <td>${d.name}</td>
                <td>${d.segments.toLocaleString()}</td>
                <td>${d.oldHourly.refreshMs.toLocaleString()}ms</td>
                <td>${d.oldHourly.queryAvgMs.toLocaleString()}ms</td>
                <td>${d.oldHourly.totalMs.toLocaleString()}ms</td>
                <td class="good">${d.newHourly.refreshMs.toLocaleString()}ms</td>
                <td class="good">${d.newHourly.queryAvgMs.toLocaleString()}ms</td>
                <td class="good">${d.newHourly.totalMs.toLocaleString()}ms</td>
                <td class="good">${(d.oldHourly.totalMs / d.newHourly.totalMs).toFixed(2)}x</td>
            </tr>
        `).join('')}
    `;
}
</script>
</body>
</html>
