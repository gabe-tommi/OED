<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OED TimescaleDB Benchmark</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Courier New', monospace; background: #0d1117; color: #e6edf3; min-height: 100vh; padding: 40px; }
        header { margin-bottom: 40px; }
        header h1 { font-size: 1.4rem; font-weight: normal; color: #58a6ff; letter-spacing: 0.05em; text-transform: uppercase; }
        header p { color: #8b949e; font-size: 0.85rem; margin-top: 6px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 24px; }
        .card.full { grid-column: 1 / -1; }
        .card h2 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: #8b949e; margin-bottom: 20px; }
        .chart-container { position: relative; height: 320px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
        th { text-align: left; padding: 8px 12px; color: #8b949e; font-weight: normal; border-bottom: 1px solid #30363d; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
        td { padding: 10px 12px; border-bottom: 1px solid #21262d; color: #e6edf3; }
        tr:last-child td { border-bottom: none; }
        td.good { color: #3fb950; }
        td.warn { color: #d29922; }
        td.highlight { color: #f85149; font-weight: bold; }
        .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .stat { background: #0d1117; border: 1px solid #30363d; border-radius: 4px; padding: 16px; }
        .stat .label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: #8b949e; margin-bottom: 8px; }
        .stat .value { font-size: 1.6rem; color: #58a6ff; }
        .stat .unit { font-size: 0.75rem; color: #8b949e; margin-left: 4px; }
        .paste-area { width: 100%; background: #0d1117; border: 1px solid #30363d; border-radius: 4px; color: #e6edf3; font-family: 'Courier New', monospace; font-size: 0.8rem; padding: 12px; resize: vertical; min-height: 100px; }
        .paste-area:focus { outline: 1px solid #58a6ff; }
        button { margin-top: 12px; background: #238636; border: 1px solid #2ea043; color: #fff; font-family: 'Courier New', monospace; font-size: 0.85rem; padding: 8px 20px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #2ea043; }
        .error { color: #f85149; font-size: 0.8rem; margin-top: 8px; }
        .legend { display: flex; gap: 20px; margin-bottom: 16px; font-size: 0.78rem; color: #8b949e; }
        .legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
        .bar-fill { height: 8px; border-radius: 2px; }
        .bar-track { background: #21262d; border-radius: 2px; margin-top: 6px; overflow: hidden; }
    </style>
</head>
<body>

<header>
    <h1>OED // TimescaleDB Query Performance Benchmark</h1>
    <p>Compares readings (baseline) vs readings_hypertable vs cagg_hourly_readings_unit — same cik_vary overlap join across all scenarios</p>
</header>

<div class="card full" style="margin-bottom: 24px;">
    <h2>Paste benchmark_hypertable_results.json</h2>
    <textarea class="paste-area" id="jsonInput" placeholder='[{"name":"1 segment (no variation)","segments":1,"readings":{"avgMs":66,...},"hypertable":{...},"cagg":{...}}]'></textarea>
    <button onclick="loadData()">Load Results</button>
    <div class="error" id="error"></div>
</div>

<div class="stat-grid" id="stats"></div>
<div class="grid" id="charts"></div>

<script>
let charts = {};

// const SAMPLE = [
//     {"name":"1 segment","segments":1,"readings":{"avgMs":66,"minMs":56,"maxMs":79,"rowCount":35047},"hypertable":{"avgMs":62,"minMs":55,"maxMs":70,"rowCount":35047},"cagg":{"avgMs":18,"minMs":15,"maxMs":22,"rowCount":8760}},
//     {"name":"12 segments (monthly)","segments":12,"readings":{"avgMs":64,"minMs":63,"maxMs":65,"rowCount":35047},"hypertable":{"avgMs":60,"minMs":58,"maxMs":63,"rowCount":35047},"cagg":{"avgMs":20,"minMs":18,"maxMs":23,"rowCount":8760}},
//     {"name":"52 segments (weekly)","segments":52,"readings":{"avgMs":225,"minMs":223,"maxMs":226,"rowCount":35047},"hypertable":{"avgMs":180,"minMs":175,"maxMs":186,"rowCount":35047},"cagg":{"avgMs":55,"minMs":52,"maxMs":59,"rowCount":8760}},
//     {"name":"365 segments (daily)","segments":365,"readings":{"avgMs":1439,"minMs":1410,"maxMs":1464,"rowCount":35047},"hypertable":{"avgMs":950,"minMs":930,"maxMs":975,"rowCount":35047},"cagg":{"avgMs":280,"minMs":270,"maxMs":295,"rowCount":8760}},
//     {"name":"2160 segments (4hr)","segments":2160,"readings":{"avgMs":8717,"minMs":8450,"maxMs":9183,"rowCount":35047},"hypertable":{"avgMs":5200,"minMs":5050,"maxMs":5400,"rowCount":35047},"cagg":{"avgMs":1400,"minMs":1350,"maxMs":1460,"rowCount":8760}},
//     {"name":"8760 segments (hourly)","segments":8760,"readings":{"avgMs":33864,"minMs":33536,"maxMs":34090,"rowCount":35047},"hypertable":{"avgMs":18000,"minMs":17600,"maxMs":18500,"rowCount":35047},"cagg":{"avgMs":5200,"minMs":5050,"maxMs":5400,"rowCount":8760}},
//     {"name":"17520 segments (30min)","segments":17520,"readings":{"avgMs":68464,"minMs":67677,"maxMs":69131,"rowCount":35047},"hypertable":{"avgMs":34000,"minMs":33200,"maxMs":35100,"rowCount":35047},"cagg":{"avgMs":9800,"minMs":9500,"maxMs":10200,"rowCount":8760}}
// ];

function loadData() {
    const input = document.getElementById('jsonInput').value.trim();
    const errorEl = document.getElementById('error');
    errorEl.textContent = '';
    let data;
    try {
        data = JSON.parse(input);
        if (!Array.isArray(data)) throw new Error('Expected an array');
        if (!data[0].readings) throw new Error('Missing readings field — use benchmark_hypertable_results.json, not the old format');
    } catch(e) {
        errorEl.textContent = 'Invalid JSON: ' + e.message;
        return;
    }
    renderAll(data);
}

function renderAll(data) {
    const baseline = data[0].readings.avgMs;
    const worst = data[data.length - 1];

    document.getElementById('stats').innerHTML = `
        <div class="stat"><div class="label">Baseline readings (1 seg)</div><div class="value">${baseline}<span class="unit">ms</span></div></div>
        <div class="stat"><div class="label">Worst readings (${worst.segments.toLocaleString()} segs)</div><div class="value">${worst.readings.avgMs.toLocaleString()}<span class="unit">ms</span></div></div>
        <div class="stat"><div class="label">Worst hypertable</div><div class="value">${worst.hypertable.avgMs.toLocaleString()}<span class="unit">ms</span></div></div>
        <div class="stat"><div class="label">Worst cagg</div><div class="value">${worst.cagg.avgMs.toLocaleString()}<span class="unit">ms</span></div></div>
    `;

    const labels = data.map(d => d.segments.toLocaleString() + ' segs');
    const gc = '#21262d';
    const tc = '#8b949e';

    const chartsEl = document.getElementById('charts');
    chartsEl.innerHTML = `
        <div class="card full">
            <h2>Query time vs conversion segments</h2>
            <div class="legend">
                <span><span class="legend-dot" style="background:#8b949e"></span>readings (baseline)</span>
                <span><span class="legend-dot" style="background:#58a6ff"></span>readings_hypertable</span>
                <span><span class="legend-dot" style="background:#3fb950"></span>cagg_hourly</span>
            </div>
            <div class="chart-container"><canvas id="mainChart" role="img" aria-label="Line chart comparing query times across structures and segment counts">Query time comparison.</canvas></div>
        </div>
        <div class="card">
            <h2>Speedup vs baseline</h2>
            <div class="chart-container"><canvas id="speedupChart" role="img" aria-label="Bar chart showing speedup factor of hypertable and cagg vs readings baseline">Speedup chart.</canvas></div>
        </div>
        <div class="card">
            <h2>High segment scenarios only (≥365 segs)</h2>
            <div class="chart-container"><canvas id="zoomChart" role="img" aria-label="Zoomed line chart for high segment counts">Zoom chart.</canvas></div>
        </div>
        <div class="card full">
            <h2>Results table</h2>
            <table id="resultsTable"></table>
        </div>
    `;

    Object.values(charts).forEach(c => c.destroy());
    charts = {};

    charts.main = new Chart(document.getElementById('mainChart'), {
        type: 'line',
        data: {
            labels,
            datasets: [
                { label: 'readings (baseline)', data: data.map(d => d.readings.avgMs), borderColor: '#8b949e', backgroundColor: 'rgba(139,148,158,0.07)', fill: true, tension: 0.3, pointRadius: 5, borderDash: [4,3] },
                { label: 'readings_hypertable',  data: data.map(d => d.hypertable.avgMs), borderColor: '#58a6ff', backgroundColor: 'rgba(88,166,255,0.07)', fill: true, tension: 0.3, pointRadius: 5 },
                { label: 'cagg_hourly',          data: data.map(d => d.cagg.avgMs), borderColor: '#3fb950', backgroundColor: 'rgba(63,185,80,0.07)', fill: true, tension: 0.3, pointRadius: 5 }
            ]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { labels: { color: tc } } },
            scales: { x: { ticks: { color: tc }, grid: { color: gc } }, y: { ticks: { color: tc, callback: v => v + 'ms' }, grid: { color: gc } } }
        }
    });

    charts.speedup = new Chart(document.getElementById('speedupChart'), {
        type: 'bar',
        data: {
            labels,
            datasets: [
                { label: 'hypertable ×faster', data: data.map(d => parseFloat((d.readings.avgMs / d.hypertable.avgMs).toFixed(2))), backgroundColor: 'rgba(88,166,255,0.7)' },
                { label: 'cagg ×faster',       data: data.map(d => parseFloat((d.readings.avgMs / d.cagg.avgMs).toFixed(2))),       backgroundColor: 'rgba(63,185,80,0.7)' }
            ]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { labels: { color: tc } } },
            scales: {
                x: { ticks: { color: tc }, grid: { color: gc } },
                y: { ticks: { color: tc, callback: v => v + '×' }, grid: { color: gc }, title: { display: true, text: 'Times faster than baseline', color: tc } }
            }
        }
    });

    const high = data.filter(d => d.segments >= 365);
    charts.zoom = new Chart(document.getElementById('zoomChart'), {
        type: 'line',
        data: {
            labels: high.map(d => d.segments.toLocaleString() + ' segs'),
            datasets: [
                { label: 'readings', data: high.map(d => d.readings.avgMs), borderColor: '#8b949e', tension: 0.3, pointRadius: 5, borderDash: [4,3] },
                { label: 'hypertable', data: high.map(d => d.hypertable.avgMs), borderColor: '#58a6ff', tension: 0.3, pointRadius: 5 },
                { label: 'cagg',       data: high.map(d => d.cagg.avgMs), borderColor: '#3fb950', tension: 0.3, pointRadius: 5 }
            ]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { labels: { color: tc } } },
            scales: { x: { ticks: { color: tc }, grid: { color: gc } }, y: { ticks: { color: tc, callback: v => v + 'ms' }, grid: { color: gc } } }
        }
    });

    const maxMs = Math.max(...data.map(d => d.readings.avgMs));
    document.getElementById('resultsTable').innerHTML = `
        <tr><th>Scenario</th><th>Segs</th><th>readings</th><th>hypertable</th><th>cagg</th><th>hypertable ×</th><th>cagg ×</th><th>Relative</th></tr>
        ${data.map(d => {
            const hf = (d.readings.avgMs / d.hypertable.avgMs).toFixed(1);
            const cf = (d.readings.avgMs / d.cagg.avgMs).toFixed(1);
            const pct = Math.round((d.readings.avgMs / maxMs) * 100);
            return `<tr>
                <td>${d.name}</td>
                <td>${d.segments.toLocaleString()}</td>
                <td>${d.readings.avgMs.toLocaleString()}ms</td>
                <td class="good">${d.hypertable.avgMs.toLocaleString()}ms</td>
                <td class="good">${d.cagg.avgMs.toLocaleString()}ms</td>
                <td class="good">${hf}×</td>
                <td class="good">${cf}×</td>
                <td style="min-width:100px"><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:#8b949e"></div></div></td>
            </tr>`;
        }).join('')}
    `;
}

renderAll(SAMPLE);
</script>
</body>
</html>
